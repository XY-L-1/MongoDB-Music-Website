<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>Add Song</title>

        <style>
        
            form {
                font: 15px Arial;
                padding: 10px;
                margin: 8px 10px;
            }
        
            .addSong {
                margin-right: 1rem;
                margin-left: 5rem;
                display: inline-block;
                text-align: left;
                border: 2px solid black;
                padding: 10px;
                background-color: #F5DEB3;
                border-radius: 10px;
            }
        
            .addSong legend {
                padding: 5px;
                border-radius: 5px;
                background-color: sandybrown;
            }
        </style>
        
    </head>

    <body>
        <header>
            <!-- navigation links to other pages -->
            <nav>
                <h1>Music Services</h1>
                <ul>
                    <li>
                        <a href="songs.html">Main Page</a>
                    </li>

                    <li> 
                        <a href="addSong.html">Add a Song</a>
                    </li>
    
                    <li>
                        <a href="updateSong.html">Update a Song</a>
                    </li>
    
                    <li>
                        <a href="deleteSong.html">Delete a Song</a>
                    </li>
    
                    <li>
                        <a href="search.html">Search by Genre</a>
                    </li>
    
                    <li>
                        <a href="listSongs.html"> List all Songs</a>
                    </li>
                </ul>
            </nav>
        </header>

        <main>
            <h1>Add a Song</h1>
            <form>
                <filedset class="addSong">
                    <legend>Song Details</legend>
                    <p>
                       <label for="title">Title:</label>
                       <input type="text" id="title">
                    </p>
                    <p>
                       <label for="artist">Artist:</label>
                       <input type="text" id="artist">
                    </p>
                    <p>
                       <label for="released">Released:</label>
                       <input type="date" id="released">
                    </p>
                    <p>
                       <label for="popularity">Popularity:</label>
                       <input type="number" min="1" max="10"
                          id="popularity">
                    </p>
                    <p>
                       <label for="genre">Genre:</label>
                       <input type="text" id="genre">
                    </p>
                    <p>
                       <input type="button" id="addBtn" value="Add">
                    </p>
                    <p id="error"></p>
                </filedset>
             </form>
        </main>
        <footer>
            <p><i>&copy; 2023 The Music Company - created by Xiaoyu Luo</i></p>
        </footer>

    </body>

    <script>
        addEventListener("DOMContentLoaded", function() {
            document.querySelector("#addBtn").addEventListener("click", addSong);
        });

        async function addSong() {
        // Create a song object from the form fields
        const song = {
            title: document.querySelector("#title").value,
            artist: document.querySelector("#artist").value,
            releaseDate: document.querySelector("#released").value,
            popularity: document.querySelector("#popularity").value,
            genre: document.querySelector("#genre").value ? 
            document.querySelector("#genre").value.split(",") : []
        };

        // POST a JSON-encoded song to Music API
        const response = await fetch("/api/songs", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(song)
        });

        if (response.ok) {
            const results = await response.json();
            alert("Added song with ID " + results._id);

        // Reset the form after adding the song
            document.querySelector("form").reset();
            }
        else {
            document.querySelector("#error").innerHTML = "Cannot add song.";
            }     
        }
    </script>
</html>
